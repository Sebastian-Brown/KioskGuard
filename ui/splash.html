<!doctype html><html><head><meta charset="utf-8"><style>html,body,video{margin:0;width:100%;height:100%;background:#000;overflow:hidden}</style></head><body><video id="v" autoplay playsinline></video><script>const v=document.querySelector('#v'),q=new URLSearchParams(location.search);v.src=q.get('file');v.style.objectFit=q.get('fit')||'fill';v.volume=1;try{const ac=new AudioContext(),source=ac.createMediaElementSource(v),limiter=ac.createDynamicsCompressor();limiter.threshold.value=-30;limiter.knee.value=0;limiter.ratio.value=20;limiter.attack.value=.001;limiter.release.value=.35;source.connect(limiter).connect(ac.destination);v.addEventListener('play',()=>ac.resume())}catch(e){}v.addEventListener('ended',()=>chrome.webview.postMessage('ended'));v.addEventListener('error',()=>chrome.webview.postMessage('error:'+((v.error&&v.error.message)||'unknown video error')));v.play().catch(e=>chrome.webview.postMessage('error:'+e.message));</script></body></html>
