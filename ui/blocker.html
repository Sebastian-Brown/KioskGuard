<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body,#backdrop{margin:0;width:100%;height:100%;overflow:hidden;background:#050812}#backdrop{position:fixed;inset:0;background:linear-gradient(135deg,#123c8a,#0cc7c1)}#backdrop.midnight{background:#050812}#backdrop.aurora{background:linear-gradient(135deg,#542184,#12b9a7)}#media{width:100%;height:100%;display:none}.text-layer{position:fixed;inset:8%;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;font:800 clamp(24px,4vmin,76px)/1.15 system-ui,sans-serif;z-index:5}.outline{color:transparent;-webkit-text-fill-color:transparent;-webkit-text-stroke:2px #fff;mix-blend-mode:difference}.fill{z-index:6}</style></head><body><div id="backdrop"><video id="media" autoplay muted loop playsinline></video></div><div id="outline" class="text-layer outline"></div><div id="fill" class="text-layer fill"></div><script>const q=new URLSearchParams(location.search),backdrop=document.querySelector('#backdrop'),media=document.querySelector('#media'),outline=document.querySelector('#outline'),fill=document.querySelector('#fill');backdrop.className=q.get('style')||'ocean';const file=q.get('file'),fit=q.get('fit')||'fill',text=q.get('message')||'',show=q.get('show')==='1';outline.textContent=fill.textContent=text;outline.style.display=fill.style.display=show?'flex':'none';fill.style.color=q.get('color')||'#fff';if(file){const image=/\.(png|jpe?g|gif|webp|bmp)$/i.test(file);if(image){const img=document.createElement('img');img.id='media';img.src=file;img.style.cssText=`display:block;width:100%;height:100%;object-fit:${fit}`;media.replaceWith(img)}else{media.style.display='block';media.style.objectFit=fit;media.src=file;media.play().catch(()=>{})}}</script></body></html>
